[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-gdt-burstcube"
authors = [
    { name = "The BurstCube Team" },
]
description = "Gamma-ray Data Tools: BurstCube Mission"
# NOTE: gdt-fermi points this at a separate PYPI-README.rst; that file, along
# with the full README.rst, is added in a later round of this plugin's
# development. Until then this points at the top-level README.md so that the
# package remains installable.
readme = "README.md"
license = "Apache-2.0"
license-files = ["license.txt"]
keywords = ['astronomy', 'gammaray', 'gamma-ray', 'burstcube']
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = [
    'astro-gdt>=2.2.3',
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["Sphinx==5.0.2", "astropy-sphinx-theme", "nbsphinx", "sphinx-automodapi"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gdt.missions.burstcube.data" = [
    'bccs0_align_20210101v000.fits',
    'bccs1_align_20210101v000.fits',
    'bccs2_align_20210101v000.fits',
    'bccs3_align_20210101v000.fits',
    'bccsa_saareg_20230101v001.fits',
    'bccsa_eb16_20221001v001.fits',
    'bccsa_eb64_20221001v001.fits',
    'bccsa_eb1024_20221001v001.fits',
    'bccsa_reb16_20221001v001.fits',
    'bccsa_reb64_20221001v001.fits',
]
"gdt.data" = ['burstcube.urls']

[tool.setuptools.dynamic]
version = { attr = "gdt.missions.burstcube.__version__" }

[project.urls]
Documentation = 'https://astro-gdt-burstcube.readthedocs.io/en/latest/'
Repository = 'https://github.com/USRA-STI/gdt-burstcube'
Issues = 'https://github.com/USRA-STI/gdt-burstcube/issues'
